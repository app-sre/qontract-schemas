---
"$schema": /metaschema-1.json
version: "1.0"
type: object
title: "App Interface Database Access"
description: |
  Schema for defining database access in app-interface.
  This includes details about the user, database, and access permissions.

additionalProperties: false
properties:
  "$schema":
    type: string
    enum:
    - /app-interface/database-access-1.yml
  name:
    type: string
    description: |
      The name of the database access object.
  username:
    "$ref": "/common-1.json#/definitions/psqlIdentifier"
    description: |
      The username for the database access. Required unless 'role' is set.
      When 'role' is set, the username can be omitted: it is then managed
      by the database-access-manager integration and generated
      deterministically. Keeping an explicit username is only useful to
      migrate an existing DAM-managed user to the role model without
      changing the user. Once set, the username cannot be changed.
  database:
    "$ref": "/common-1.json#/definitions/psqlIdentifier"
    description: |
      The name of the database to which access is being granted.
  delete:
    type: boolean
    description: |
      Indicates whether the database access should be deleted.
  role:
    "$ref": "/common-1.json#/definitions/psqlIdentifier"
    description: |
      Optional NOLOGIN owner role. When set, the role owns all managed
      objects in the target schemas of the access list and the username
      becomes a member of it, acting as the role by default in new
      sessions. This enables zero-downtime password rotation: multiple
      database_access entries can share the same role with different
      usernames. When the database is the admin default database
      (e.g. postgres), existing objects owned by the admin user are
      transferred to the role. The access list may be empty in role
      mode (only role, user and membership are managed). Cannot be
      changed after creation.
  access:
    type: array
    description: |
      A list of access permissions for the database. May be empty when
      'role' is set: only the role, the user and the membership are
      managed then. In role mode, grants are applied to the owner role
      and are only meaningful for schemas owned by other roles: on
      schemas the owner role owns, membership already includes all
      privileges.
    items:
      type: object
      additionalProperties: false
      properties:
        grants:
          type: array
          description: |
            A list of grants specifying the permissions for the database.
          items:
            type: string
            enum:
            - ALL
            - SELECT
            - INSERT
            - UPDATE
            - DELETE
            - TRUNCATE
            - REFERENCES
            - TRIGGER
        target:
          type: object
          description: |
            The target schema within the database for the access permissions.
          additionalProperties: false
          properties:
            dbschema:
              "$ref": "/common-1.json#/definitions/psqlIdentifier"
              description: |
                The schema within the database to which the access applies.
      required:
      - grants
      - target

required:
- name
- database
