---
"$schema": /metaschema-1.json
version: "1.0"
type: object
title: "Endpoint Monitoring Provider"
description: |
  Schema for referencing an endpoint monitoring provider as a dependency in app-interface.
  This schema enables teams to declare monitoring providers for endpoints, supporting
  integration with blackbox-exporter and prometheus-metrics-importer, with legacy signalfx
  support during migration. Use this schema to specify provider type,
  check intervals, timeouts, metric labels, and provider-specific configuration for
  endpoint monitoring automation and observability.

additionalProperties: false

properties:
  "$schema":
    type: string
    enum:
    - /dependencies/endpoint-monitoring-provider-1.yml

  labels:
    "$ref": "/common-1.json#/definitions/labels"

  name:
    type: string
    description: |
      The unique name of the endpoint monitoring provider. Used to identify and
      reference this provider in app-interface and related integrations.

  description:
    type: string
    description: |
      A human-readable description of the endpoint monitoring provider, its
      purpose, or any relevant operational context.

  provider:
    type: string
    enum:
    - blackbox-exporter
    - prometheus-metrics-importer
    - signalfx
    description: |
      The provider defines which monitoring implementation will be used for endpoints.
      Supported values are 'blackbox-exporter', 'prometheus-metrics-importer', and the
      legacy 'signalfx' provider. Use 'prometheus-metrics-importer' for backend-independent
      import of endpoint monitoring results from a Prometheus exporter.

  timeout:
    type: string
    pattern: "^\\d+[smhd]$"
    description: |
      Timeout for the monitoring check (e.g., '10s', '5m'). Specifies how long
      to wait for a check to complete before considering it failed.

  checkInterval:
    type: string
    pattern: "^\\d+[smhd]$"
    description: |
      Interval between endpoint checks (e.g., '10s', '1m'). Determines how
      frequently the monitoring provider will check the endpoint.

  metricLabels:
    "$ref": "/common-1.json#/definitions/prometheusLabels"
    description: |
      Labels to be added to the resulting Prometheus metrics. Used for
      categorization and filtering of metrics in observability systems.

  blackboxExporter:
    type: object
    description: |
      Configuration options specific to the blackbox-exporter provider.
      Used when 'provider' is set to 'blackbox-exporter'.
    additionalProperties: false
    properties:
      module:
        type: string
        description: |
          The blackbox exporter module to use for the endpoint check (e.g., 'http_2xx').
          Modules define the type of probe and protocol to use.
      namespace:
        "$ref": "/common-1.json#/definitions/crossref"
        "$schemaRef": "/openshift/namespace-1.yml"
        description: |
          Reference to the namespace where the Prometheus Probe CR will be created.
      exporterUrl:
        type: string
        format: uri
        description: |
          The blackbox-exporter URL to use. Must be a full scrape URL accessible
          by the monitoring system.
    required:
    - module
    - namespace
    - exporterUrl

  prometheusMetricsImporter:
    type: object
    description: |
      Configuration for the prometheus-metrics-importer provider. Imports existing
      endpoint monitoring results from an exporter rather than executing checks.
    additionalProperties: false
    properties:
      namespace:
        "$ref": "/common-1.json#/definitions/crossref"
        "$schemaRef": "/openshift/namespace-1.yml"
        description: |
          Namespace reference identifying the cluster used for endpoint monitoring.
      exporterUrl:
        type: string
        format: uri
        description: |
          Base scrape URL of an exporter accessible by Prometheus, including the
          metrics path. The exporter must support target filtering at
          <exporterUrl>/<targetFilterLabel>?target=<endpoint-name>.
      targetFilterLabel:
        type: string
        description: |
          Metric label containing the endpoint name to filter on, such as 'probe'.
          Appended to exporterUrl to select the target-filtered scrape endpoint.
    required:
    - namespace
    - exporterUrl
    - targetFilterLabel

  signalFx:
    type: object
    description: |
      Legacy configuration used when 'provider' is set to 'signalfx'.
      Retained for compatibility during migration to prometheusMetricsImporter.
    additionalProperties: false
    properties:
      namespace:
        "$ref": "/common-1.json#/definitions/crossref"
        "$schemaRef": "/openshift/namespace-1.yml"
        description: |
          Reference to the namespace where the Prometheus Probe CR will be created.
      exporterUrl:
        type: string
        format: uri
        description: |
          The signalfx-prometheus-exporter URL to use. Must be a full scrape URL
          accessible by the monitoring system.
      targetFilterLabel:
        type: string
        description: |
          The signalfx label that holds the target value to be filtered on.
    required:
    - namespace
    - exporterUrl
    - targetFilterLabel

oneOf:
- properties:
    provider:
      type: string
      enum:
      - blackbox-exporter
    blackboxExporter:
      type: object
      additionalProperties: false
      properties:
        module:
          type: string
        namespace:
          "$ref": "/common-1.json#/definitions/crossref"
          "$schemaRef": "/openshift/namespace-1.yml"
        exporterUrl:
          type: string
      required:
      - module
      - namespace
      - exporterUrl
  required:
  - blackboxExporter
- properties:
    provider:
      type: string
      enum:
      - prometheus-metrics-importer
    prometheusMetricsImporter:
      type: object
      additionalProperties: false
      properties:
        namespace:
          "$ref": "/common-1.json#/definitions/crossref"
          "$schemaRef": "/openshift/namespace-1.yml"
        exporterUrl:
          type: string
        targetFilterLabel:
          type: string
      required:
      - namespace
      - exporterUrl
      - targetFilterLabel
  required:
  - prometheusMetricsImporter
- properties:
    provider:
      type: string
      enum:
      - signalfx
    signalFx:
      type: object
      additionalProperties: false
      properties:
        namespace:
          "$ref": "/common-1.json#/definitions/crossref"
          "$schemaRef": "/openshift/namespace-1.yml"
        exporterUrl:
          type: string
        targetFilterLabel:
          type: string
      required:
      - namespace
      - exporterUrl
      - targetFilterLabel
  required:
  - signalFx

required:
- "$schema"
- labels
- name
- description
- provider
