---
"$schema": /metaschema-1.json
version: "1.0"
type: object

additionalProperties: false
properties:
  "$schema":
    type: string
    enum:
    - /dependencies/quay-org-1.yml
  labels:
    "$ref": "/common-1.json#/definitions/labels"
  name:
    type: string
  instance:
    "$ref": "/common-1.json#/definitions/crossref"
    "$schemaRef": "/dependencies/quay-instance-1.yml"
  mirror:
    "$ref": "/common-1.json#/definitions/crossref"
    "$schemaRef": "/dependencies/quay-org-1.yml"
  mirrorFilters:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        name:
          description: Name of the repository to filter.
          type: string
        tags:
          description: |
            This limits which tags to mirror to the ones in the list.
            They will take preference over the ones excluded.
            Regular expressions are supported.
          type: array
          items:
            type: string
        tagsExclude:
          description: |
            Tags to exclude. Regular expression are supported.
          type: array
          items:
            type: string
      required:
      - name
      oneOf:
      - required:
        - tags
      - required:
        - tagsExclude
  managedTeams:
    type: array
    items:
      type: string
  description:
    type: string
  managedRepos:
    type: boolean
  managedRobotAccounts:
    type: boolean
    description: |
      When true, quay-robot-accounts may inventory and reconcile robot accounts
      for this organization. Defaults to false (opt-in). Requires an
      automationToken with Administer Organization (and Administer Repositories
      if repository permissions are managed).
  serverUrl:
    type: string
    format: uri
  automationToken:
    "$ref": "/common-1.json#/definitions/vaultSecret"
  pushCredentials:
    "$ref": "/common-1.json#/definitions/vaultSecret"
required:
- "$schema"
- labels
- name
- managedTeams
- description
- managedRepos
