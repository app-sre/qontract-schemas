---
"$schema": /metaschema-1.json
version: "1.0"
type: object

additionalProperties: false
properties:
  "$schema":
    type: string
    enum:
    - /dependencies/slack-workspace-1.yml
  labels:
    "$ref": "/common-1.json#/definitions/labels"
  name:
    type: string
  description:
    type: string
  token:
    "$ref": "/common-1.json#/definitions/vaultSecret"
  api_client:
    type: object
    properties:
      global:
        type: object
        properties:
          max_retries:
            type: integer
          timeout:
            type: integer
        additionalProperties: false
      methods:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            args:
              type: object
          required:
          - name
          - args
          additionalProperties: false
    additionalProperties: false
  integrations:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
      token:
        "$ref": "/common-1.json#/definitions/vaultSecret"
      channel:
        type: string
      icon_emoji:
        type: string
      username:
        type: string
      required:
      - name
      - token
      - channel
      - icon_emoji
      - username
  incomingWebhooks:
    description: Incoming webhooks owned by this Slack workspace.
    type: array
    items:
      type: object
      properties:
        channel:
          description: Slack channel name without the leading hash.
          type: string
        targets:
          description: Locations that store the webhook URL for the channel.
          type: array
          items:
            oneOf:
            - type: object
              properties:
                type:
                  description: Target type.
                  type: string
                  enum:
                  - vault-secret
                path:
                  description: Vault secret path.
                  type: string
                field:
                  description: Vault secret field.
                  type: string
              required:
              - type
              - path
              - field
              additionalProperties: false
            - type: object
              properties:
                type:
                  description: Target type.
                  type: string
                  enum:
                  - hcp-terraform-variable-set
                project:
                  description: HCP Terraform project name.
                  type: string
                name:
                  description: HCP Terraform variable set name.
                  type: string
                variable:
                  description: HCP Terraform variable key.
                  type: string
              required:
              - type
              - project
              - name
              - variable
              additionalProperties: false
      required:
      - channel
      - targets
      additionalProperties: false
  managedUsergroups:
    type: array
    items:
      type: string
required:
- "$schema"
- labels
- name
- description
- token
